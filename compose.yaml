services:
  spam-bot:
    build:
      context: .
    restart: unless-stopped
    stop_grace_period: 60s
    init: true
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      LOG_TO_FILE: "false"
      LOGS_DIR: /tmp/logs
      WEBPAGE_BLOCKED_IPS: "${WEBPAGE_BLOCKED_IPS:-}"
    read_only: true
    cpus: "1.0"
    mem_limit: 512m
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    volumes:
      - bot-data:/app/data
    healthcheck:
      test: ["CMD", "./fuckyou-spam-rust", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
