services:
  spam-bot:
    build:
      context: .
    image: fuckyou-spam-rust:latest
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    env_file:
      - .env
    environment:
      - SKIP_PROCESS_GUARD=1
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    volumes:
      - bot-data:/app/data
      - bot-logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
  bot-logs:
